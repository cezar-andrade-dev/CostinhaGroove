# =============================================
# COSTINHA SOUNDBOARD — .github/workflows/deploy.yml
# Deploy automático: frontend no Vercel, backend no Railway
# =============================================

name: Deploy

on:
  push:
    branches: [main]

jobs:

  # ── JOB 1: TESTES DO BACKEND ──────────────
  test-backend:
    name: Testa o backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instala Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Instala dependências
        working-directory: backend
        run: npm ci

      - name: Verifica se o servidor sobe sem erros
        working-directory: backend
        run: |
          cp .env.example .env
          timeout 5 node src/server.js || true
        # "|| true" evita falha se o processo for encerrado pelo timeout

  # ── JOB 2: DEPLOY DO FRONTEND (VERCEL) ────
  deploy-frontend:
    name: Deploy do frontend no Vercel
    needs: test-backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Deploy no Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: frontend
          vercel-args: "--prod"

  # ── JOB 3: DEPLOY DO BACKEND (RAILWAY) ────
  deploy-backend:
    name: Deploy do backend no Railway
    needs: test-backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instala Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy no Railway
        working-directory: backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service costinha-api
